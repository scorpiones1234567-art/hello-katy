<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#9bd6ff">
<title>Hello Katty</title>

<style>
:root{
  --blue:#75caff;
  --dark:#713858
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  color:var(--dark);
  font-family:system-ui,sans-serif;
  background:radial-gradient(circle,#fff,#eaf6ff 60%,#f5eaff);
  min-height:100vh
}

header{
  text-align:center;
  padding:15px;
  background:linear-gradient(120deg,#80cfff,#d7c9ff);
  border-radius:0 0 25px 25px
}

h1{
  margin:0;
  color:white;
  font-size:32px;
  text-shadow:0 3px #397fbd
}

.top{
  display:flex;
  gap:10px;
  margin:12px auto;
  padding:0 12px;
  max-width:700px;
  font-weight:bold
}

.meter,.coins{
  background:white;
  border:2px solid #b8ddff;
  border-radius:25px;
  padding:9px;
  flex:1
}

.bar{
  height:9px;
  background:#d5eafa;
  border-radius:20px;
  margin-top:5px
}

.bar i{
  display:block;
  height:100%;
  width:75%;
  background:#3998e9;
  border-radius:20px
}

main{
  max-width:700px;
  margin:auto;
  padding:0 12px 25px
}

.room{
  position:relative;
  overflow:hidden;
  min-height:420px;
  border:3px solid #c6e5ff;
  border-radius:28px;
  background:linear-gradient(
    #d7edff 0 62%,
    #e9c5ee 62% 68%,
    #d99fc8 68%
  )
}

.window{
  position:absolute;
  left:6%;
  top:8%;
  width:23%;
  height:28%;
  border:8px solid #fff0f8;
  border-radius:15px;
  background:linear-gradient(#aee7ff,#b8e7ad)
}

.bed{
  position:absolute;
  right:3%;
  bottom:17%;
  width:34%;
  height:28%;
  background:#b9dfff;
  border:7px solid #78b9ed;
  border-radius:35px 35px 15px 15px
}

.bed:before{
  content:"";
  position:absolute;
  inset:20% 8%;
  background:#e8f6ff;
  border-radius:12px
}

.rug{
  position:absolute;
  bottom:2%;
  left:13%;
  width:74%;
  height:25%;
  background:#8fc9f5;
  border:8px solid #cbe8ff;
  border-radius:50%
}

.speech{
  position:absolute;
  z-index:5;
  right:3%;
  top:6%;
  max-width:47%;
  background:white;
  border:3px solid #78b9ed;
  border-radius:22px;
  padding:12px;
  text-align:center;
  font-weight:bold
}

.kitty-wrap{
  position:absolute;
  z-index:2;
  left:50%;
  top:51%;
  transform:translate(-50%,-50%);
  width:245px;
  height:330px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  perspective:900px
}

.kitty{
  position:relative;
  width:220px;
  height:300px;
  transform-origin:50% 90%;
  animation:bob 2.5s ease-in-out infinite;
  filter:drop-shadow(0 12px 10px #765b8540)
}

@keyframes bob{
  0%,100%{
    transform:translateY(0) rotate(-1deg)
  }
  50%{
    transform:translateY(-8px) rotate(1deg)
  }
}

.ear{
  position:absolute;
  top:5px;
  width:82px;
  height:95px;
  background:linear-gradient(145deg,#fff,#e3efff);
  border-radius:22px 60px 12px 35px
}

.ear.left{
  left:7px;
  transform:rotate(-25deg)
}

.ear.right{
  right:7px;
  transform:scaleX(-1) rotate(-25deg)
}

.head{
  position:absolute;
  z-index:1;
  top:35px;
  width:220px;
  height:185px;
  background:linear-gradient(145deg,#fff,#e9f3ff);
  border-radius:48% 48% 43% 43%;
  box-shadow:
    inset -9px -9px 16px #cbd9ed,
    0 5px 12px #8aa5c455
}

.eye{
  position:absolute;
  top:117px;
  width:13px;
  height:21px;
  background:#28212a;
  border-radius:50%;
  z-index:3;
  animation:blink 4s infinite
}

.eye.left{
  left:61px
}

.eye.right{
  right:61px
}

@keyframes blink{
  0%,44%,48%,100%{
    transform:scaleY(1)
  }
  46%{
    transform:scaleY(.08)
  }
}

.nose{
  position:absolute;
  z-index:3;
  top:147px;
  left:103px;
  width:15px;
  height:11px;
  background:#f3c32c;
  border-radius:50%
}

.whisker{
  position:absolute;
  z-index:3;
  top:150px;
  width:37px;
  height:2px;
  background:#39313a
}

.w1{
  left:-7px;
  transform:rotate(12deg)
}

.w2{
  left:-9px;
  top:165px
}

.w3{
  left:-5px;
  top:180px;
  transform:rotate(-12deg)
}

.w4{
  right:-7px;
  transform:rotate(-12deg)
}

.w5{
  right:-9px;
  top:165px
}

.w6{
  right:-5px;
  top:180px;
  transform:rotate(12deg)
}

.bow{
  position:absolute;
  z-index:4;
  top:26px;
  right:26px;
  width:66px;
  height:43px
}

.bow:before,
.bow:after{
  content:"";
  position:absolute;
  top:0;
  width:34px;
  height:38px;
  background:linear-gradient(135deg,#75caff,#1769d2);
  border:3px solid #1454a5;
  border-radius:75% 25% 65% 35%
}

.bow:before{
  left:0;
  transform:rotate(25deg)
}

.bow:after{
  right:0;
  transform:scaleX(-1) rotate(25deg)
}

.knot{
  position:absolute;
  z-index:5;
  left:27px;
  top:13px;
  width:17px;
  height:17px;
  border-radius:50%;
  background:#2789e8;
  border:3px solid #1454a5
}

.bodykitty{
  position:absolute;
  z-index:2;
  bottom:0;
  left:37px;
  width:146px;
  height:112px;
  background:linear-gradient(135deg,#82d0ff,#287bd6);
  border-radius:45% 45% 28% 28%;
  border:3px solid #1766bd
}

.collar{
  position:absolute;
  top:-3px;
  left:27px;
  width:86px;
  height:25px;
  background:white;
  border-radius:0 0 50% 50%
}

.buttondot{
  position:absolute;
  top:47px;
  left:65px;
  width:14px;
  height:14px;
  background:#ffdb70;
  border-radius:50%
}

.arm{
  position:absolute;
  z-index:3;
  bottom:34px;
  width:42px;
  height:65px;
  background:linear-gradient(130deg,#fff,#e8e3ed);
  border-radius:28px
}

.arm.left{
  left:19px;
  transform:rotate(30deg)
}

.arm.right{
  right:18px;
  transform:rotate(-25deg)
}

.legs{
  position:absolute;
  bottom:-3px;
  left:49px;
  width:53px;
  height:40px;
  border-radius:50%;
  background:#fff;
  box-shadow:55px 0 0 -1px #f6f3f8
}

.kitty.petted{
  animation:happyJump .55s ease-in-out
}

@keyframes happyJump{
  0%{
    transform:translateY(0) scale(1)
  }
  35%{
    transform:translateY(-22px) scale(1.06)
  }
  70%{
    transform:translateY(3px) scale(.97)
  }
  100%{
    transform:translateY(0) scale(1)
  }
}

.kitty.sleeping{
  animation:sleepy 3s ease-in-out infinite
}

@keyframes sleepy{
  0%,100%{
    transform:rotate(-2deg) translateY(0)
  }
  50%{
    transform:rotate(2deg) translateY(4px)
  }
}

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin:13px 0
}

button{
  border:0;
  border-radius:17px;
  padding:12px 7px;
  background:linear-gradient(#b9e3ff,#70bafa);
  color:#244d77;
  font-size:15px;
  font-weight:850;
  box-shadow:0 4px #4b96ce;
  cursor:pointer
}

button:active{
  transform:translateY(3px);
  box-shadow:0 1px #4b96ce
}

.secondary{
  background:linear-gradient(#e8d7ff,#c6a5ed);
  box-shadow:0 4px #9876c3
}

.panel{
  background:#ffffffdf;
  border:2px solid #c9e5ff;
  border-radius:22px;
  padding:14px;
  margin:12px 0
}

.panel h2{
  margin:0 0 9px;
  color:#397fbd;
  font-size:19px
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px
}

.game{
  background:#ffffffdf;
  border:2px solid #b5e4ff;
  border-radius:16px;
  padding:12px;
  text-align
