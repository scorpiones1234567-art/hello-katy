name: Construir I-A-M REAL MUSIC STUDIO APK # Pipeline Demucs y MIDI con dependencias compatibles

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar configuración I-A-M
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar herramientas Android
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Descargar motor musical abierto
        run: |
          git clone https://github.com/roge-rm/MP3toMIDI.git build-apk
          git -C build-apk checkout 6b86c32ad60641c940e524134bc198d9fac6a205
          echo "Motor fijado al commit 6b86c32ad60641c940e524134bc198d9fac6a205"

      - name: Aplicar identidad I-A-M
        run: |
          sed -i 's/applicationId = "com.rm.mp3tomidi"/applicationId = "com.iam.musicstudio"/' build-apk/app/build.gradle.kts
          sed -i 's/rootProject.name = "MP3toMIDI"/rootProject.name = "IAMRealMusicStudio"/' build-apk/settings.gradle.kts
          cat > build-apk/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">I-A-M REAL MUSIC STUDIO</string>
              <string name="choose_input">Elegir canción</string>
              <string name="input_formats_hint">MP3, WAV, FLAC, AAC, OGG y más</string>
              <string name="choose_output">Elegir archivo de salida</string>
              <string name="output_file_name">Nombre del archivo</string>
              <string name="convert">Analizar y separar pistas</string>
              <string name="cancel_conversion">Cancelar proceso</string>
              <string name="cancel_conversion_title">¿Cancelar el proceso?</string>
              <string name="cancel_conversion_message">Se detendrá el proceso actual. Esta acción no se puede deshacer.</string>
              <string name="keep_converting">Continuar</string>
              <string name="play">Reproducir</string>
              <string name="pause">Pausar</string>
              <string name="no_file_selected">No hay canción seleccionada</string>
              <string name="conversion_channel_name">Procesamiento musical</string>
              <string name="switch_to_play_screen">Abrir reproductor MIDI</string>
              <string name="switch_to_convert_screen">Volver al estudio</string>
              <string name="midi_file_section">Archivo MIDI</string>
              <string name="choose_midi_file">Elegir archivo MIDI</string>
              <string name="no_midi_file_selected">No hay archivo seleccionado</string>
              <string name="soundfont_section">Instrumentos virtuales</string>
              <string name="soundfont_default">Banco de sonidos FluidR3 GM</string>
              <string name="soundfont_custom">Banco de sonidos propio</string>
              <string name="load_custom_soundfont">Cargar SoundFont propio</string>
              <string name="reset_to_default_soundfont">Volver al banco predeterminado</string>
              <string name="downloading_default_soundfont">Descargando sonidos (%1$d%%)</string>
              <string name="soundfont_load_failed">No se pudo cargar ese banco de sonidos</string>
          </resources>
          EOF

      - name: Añadir catálogo y prueba de instrumentos virtuales
        working-directory: build-apk
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/rm/mp3tomidi/ui/PlayScreen.kt")
          s = p.read_text()

          def replace_once(old, new, label):
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: se esperaba 1 coincidencia, encontradas {count}")
              return s.replace(old, new, 1)

          s = replace_once(
              "import androidx.compose.foundation.layout.Arrangement\n",
              "import androidx.compose.foundation.layout.Arrangement\nimport androidx.compose.foundation.layout.Box\n",
              "import Box",
          )
          s = replace_once(
              "import androidx.compose.material3.MaterialTheme\n",
              "import androidx.compose.material3.DropdownMenu\nimport androidx.compose.material3.DropdownMenuItem\nimport androidx.compose.material3.MaterialTheme\n",
              "importar menú",
          )
          s = replace_once(
              "import com.rm.mp3tomidi.R\n",
              "import com.rm.mp3tomidi.R\nimport com.rm.mp3tomidi.audio.SoundEngine\nimport com.rm.mp3tomidi.midi.GmInstrument\n",
              "importar motor e instrumentos",
          )
          s = replace_once(
              "import kotlinx.coroutines.launch\n",
              "import kotlinx.coroutines.delay\nimport kotlinx.coroutines.launch\n",
              "importar delay",
          )
          s = replace_once(
              "    var soundFontDownloadProgress by remember { mutableStateOf<Float?>(null) }\n",
              "    var soundFontDownloadProgress by remember { mutableStateOf<Float?>(null) }\n    var soundFontReady by remember { mutableStateOf(false) }\n    var selectedInstrument by remember { mutableStateOf(GmInstrument.ACOUSTIC_GRAND_PIANO) }\n    var instrumentMenuExpanded by remember { mutableStateOf(false) }\n",
              "estado del catálogo",
          )
          s = replace_once(
              "        viewModel.soundEngine.ensureLoaded { fraction -> soundFontDownloadProgress = fraction }\n        soundFontDownloadProgress = null\n",
              "        viewModel.soundEngine.ensureLoaded { fraction -> soundFontDownloadProgress = fraction }\n        soundFontDownloadProgress = null\n        soundFontReady = true\n",
              "estado del banco",
          )
          ui_anchor = """                    if (usingCustomSoundFont) {
                        OutlinedActionButton(
                            text = stringResource(R.string.reset_to_default_soundfont),
                            icon = Icons.Filled.Refresh,
                            onClick = {
                                scope.launch {
                                    soundFontDownloadProgress = 0f
                                    viewModel.soundEngine.resetToDefault({ f -> soundFontDownloadProgress = f }) { }
                                    soundFontDownloadProgress = null
                                }
                            },
                        )
                    }
                }
"""
          ui_addition = """                    if (usingCustomSoundFont) {
                        OutlinedActionButton(
                            text = stringResource(R.string.reset_to_default_soundfont),
                            icon = Icons.Filled.Refresh,
                            onClick = {
                                scope.launch {
                                    soundFontDownloadProgress = 0f
                                    viewModel.soundEngine.resetToDefault({ f -> soundFontDownloadProgress = f }) { }
                                    soundFontDownloadProgress = null
                                }
                            },
                        )
                    }
                }

                SectionCard(title = "Catálogo de instrumentos") {
                    Text(
                        "Explora los 128 instrumentos General MIDI del banco FluidR3 y escucha una muestra antes de usarlos en tus pistas.",
                        style = MaterialTheme.typography.bodyMedium,
                    )
                    Box {
                        OutlinedActionButton(
                            text = GmInstrument.NAMES[selectedInstrument],
                            icon = Icons.Filled.LibraryMusic,
                            onClick = { instrumentMenuExpanded = true },
                        )
                        DropdownMenu(
                            expanded = instrumentMenuExpanded,
                            onDismissRequest = { instrumentMenuExpanded = false },
                        ) {
                            GmInstrument.NAMES.forEachIndexed { program, name ->
                                DropdownMenuItem(
                                    text = { Text(name) },
                                    onClick = {
                                        selectedInstrument = program
                                        instrumentMenuExpanded = false
                                    },
                                )
                            }
                        }
                    }
                    OutlinedActionButton(
                        text = "ESCUCHAR INSTRUMENTO",
                        icon = Icons.Filled.PlayArrow,
                        enabled = soundFontReady,
                        onClick = {
                            scope.launch {
                                viewModel.soundEngine.noteOn(
                                    SoundEngine.MELODIC_BANK,
                                    selectedInstrument,
                                    60,
                                    0.85f,
                                )
                                delay(700)
                                viewModel.soundEngine.noteOff(
                                    SoundEngine.MELODIC_BANK,
                                    selectedInstrument,
                                    60,
                                )
                            }
                        },
                    )
                    OutlinedActionButton(
                        text = "PROBAR BATERÍA",
                        icon = Icons.Filled.PlayArrow,
                        enabled = soundFontReady,
                        onClick = {
                            scope.launch {
                                val bank = SoundEngine.PERCUSSION_BANK
                                val hits = listOf(36, 38, 42, 38, 36, 42)
                                for (note in hits) {
                                    viewModel.soundEngine.noteOn(bank, 0, note, 0.9f)
                                    delay(110)
                                    viewModel.soundEngine.noteOff(bank, 0, note)
                                    delay(90)
                                }
                            }
                        },
                    )
                    Text(
                        "Los sonidos se cargan desde el banco de muestras FluidR3 GM. La primera descarga requiere Internet; después queda guardado en el teléfono.",
                        style = MaterialTheme.typography.bodySmall,
                        color = MaterialTheme.colorScheme.onSurfaceVariant,
                    )
                }
"""
          if s.count(ui_anchor) != 1:
              raise SystemExit(f"bloque de SoundFont no encontrado de forma única: {s.count(ui_anchor)}")
          s = s.replace(ui_anchor, ui_addition, 1)
          p.write_text(s)
          print("Catálogo de 128 instrumentos y prueba de batería/piano añadidos.")
          PY

      - name: Adaptar SDK disponible
        working-directory: build-apk
        run: |
          sed -i 's/version = release(37)/version = release(36)/' app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' app/build.gradle.kts
          sed -i 's/agp = "9.4.0"/agp = "9.4.0"/' gradle/libs.versions.toml
          sed -i 's/coreKtx = "1.19.0"/coreKtx = "1.17.0"/' gradle/libs.versions.toml
          sed -i 's/appcompat = "1.6.1"/appcompat = "1.7.1"/' gradle/libs.versions.toml
          sed -i 's/material = "1.10.0"/material = "1.13.0"/' gradle/libs.versions.toml
          sed -i 's/composeBom = "2026.08.00"/composeBom = "2025.10.00"/' gradle/libs.versions.toml
          sed -i 's/activityCompose = "1.13.0"/activityCompose = "1.11.0"/' gradle/libs.versions.toml
          sed -i 's/lifecycle = "2.11.0"/lifecycle = "2.9.4"/' gradle/libs.versions.toml
          sed -i 's/work = "2.11.2"/work = "2.10.5"/' gradle/libs.versions.toml
          sed -i 's/media3 = "1.11.0"/media3 = "1.8.0"/' gradle/libs.versions.toml
          sed -i 's/onnxruntime = "1.27.0"/onnxruntime = "1.23.2"/' gradle/libs.versions.toml
          sed -i 's/oboe = "1.10.0"/oboe = "1.9.3"/' gradle/libs.versions.toml

      - name: Optimizar memoria de Demucs para móviles
        working-directory: build-apk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/rm/mp3tomidi/convert/stages/DemucsStemSeparator.kt")
          s = p.read_text()
          anchor = "setCPUArenaAllocator(false)"
          if s.count(anchor) != 1:
              raise SystemExit(f"Se esperaba una sola opción de memoria ONNX; encontradas: {s.count(anchor)}")
          addition = """setCPUArenaAllocator(false)
                      // Limita los hilos nativos para reducir picos de memoria en móviles.
                      setIntraOpNumThreads(2)
                      setInterOpNumThreads(1)"""
          p.write_text(s.replace(anchor, addition, 1))
          print("Optimización de hilos ONNX aplicada correctamente.")
          PY

      - name: Instalar NDK y CMake requeridos
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-36" "ndk;27.2.12479018" "cmake;4.1.2"

      - name: Construir aplicación Android
        working-directory: build-apk
        run: ./gradlew --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: IAM-REAL-MUSIC-STUDIO-APK
          path: build-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
