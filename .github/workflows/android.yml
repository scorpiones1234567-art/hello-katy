name: Construir I-A-M MEZCLADOR MUSICAL APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Crear proyecto Android WebView del mezclador
        run: |
          mkdir -p app/src/main/java/com/iam/musicstudio app/src/main/assets app/src/main/res/drawable
          cp ic_launcher.xml app/src/main/res/drawable/ic_launcher.xml
          cp MainActivity.java app/src/main/java/com/iam/musicstudio/MainActivity.java
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "IAMMezcladorMusical"
          include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.iam.musicstudio'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.iam.musicstudio'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="I-A-M STUDIO"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false">
                  <activity
                      android:name="com.iam.musicstudio.MainActivity"
                      android:screenOrientation="sensorLandscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: IAM-MEZCLADOR-MUSICAL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
